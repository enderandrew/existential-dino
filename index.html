<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="game-title">Chrome Offline Game - Dino Run</title>
  <link rel="stylesheet" href="index.css">
  <link id="theme-stylesheet" rel="stylesheet" href="">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://enderandrew.com/dinorun/assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="https://enderandrew.com/dinorun/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://enderandrew.com/dinorun/assets/favicon-16x16.png">
  <link rel="manifest" href="https://enderandrew.com/dinorun/assets/site.webmanifest">
  <link rel="mask-icon" href="https://enderandrew.com/dinorun/assets/safari-pinned-tab.svg" color="#5bbad5">
  <link rel="shortcut icon" href="https://enderandrew.com/dinorun/assets/favicon.ico">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="msapplication-config" content="https://enderandrew.com/dinorun/assets/browserconfig.xml">
  <meta name="theme-color" content="#ffffff">

  <!-- Theme definitions -->
  <script src="./js/themes.js"></script>
</head>

<body id="t" class="offline">
  <div id="messageBox" class="sendmessage">
    <h1 style="text-align: center; font-family: 'Open Sans', sans-serif;">Press Space to start. Down &darr; to duck.</h1>
    <div class="niokbutton" onclick="dismissMessage()"></div>
  </div>

  <div id="main-frame-error" class="interstitial-wrapper">
    <div id="main-content">
      <div class="icon icon-offline" alt=""></div>
    </div>
    <div id="offline-resources">
      <img id="offline-resources-1x" src="">
      <img id="offline-resources-2x" src="">
      <template id="audio-resources">
        <audio id="offline-sound-press"></audio>
        <audio id="offline-sound-hit"></audio>
        <audio id="offline-sound-reached"></audio>
      </template>
    </div>
  </div>

  <!-- Desktop Theme Selector Dock -->
  <footer class="footer center">
    <ul id="theme-selector"></ul>
  </footer>

  <!-- Mobile / Small-Screen "Change Theme" Button -->
  <button id="theme-modal-btn" class="theme-modal-btn" onclick="openThemeModal()">
    🎨 Change Theme
  </button>

  <!-- Theme Selection Modal -->
  <div id="theme-modal" class="theme-modal hidden">
    <div class="theme-modal-backdrop" onclick="closeThemeModal()"></div>
    <div class="theme-modal-dialog" role="dialog" aria-modal="true">
      <div class="theme-modal-header">
        <h3 class="theme-modal-title">Choose Theme</h3>
        <button class="theme-modal-close" onclick="closeThemeModal()" aria-label="Close modal">&times;</button>
      </div>
      <ul id="modal-theme-selector" class="modal-theme-grid"></ul>
    </div>
  </div>

  <!-- Theme Switcher & Asset Loader -->
  <script>
    function getActiveThemeKey() {
      const params = new URLSearchParams(window.location.search);
      const urlTheme = params.get('theme');
      if (urlTheme && THEMES[urlTheme]) {
        localStorage.setItem('dino_theme', urlTheme);
        return urlTheme;
      }
      const savedTheme = localStorage.getItem('dino_theme');
      return (savedTheme && THEMES[savedTheme]) ? savedTheme : 'color';
    }

    function applyTheme(themeKey) {
      const theme = THEMES[themeKey];
      if (!theme) return;

      // 1. Update Title & Theme Stylesheet
      document.title = theme.title || "Chrome Offline Game - Dino Run";
      const themeCss = document.getElementById('theme-stylesheet');
      if (themeCss) themeCss.href = theme.css;

      // 2. Update Sprites
      const sprite1x = document.getElementById('offline-resources-1x');
      const sprite2x = document.getElementById('offline-resources-2x');
      if (sprite1x) sprite1x.src = theme.sprite1x;
      if (sprite2x) sprite2x.src = theme.sprite2x;

      // 3. Update Audio Sources in Template
      const tpl = document.getElementById('audio-resources');
      if (tpl && tpl.content && theme.sounds) {
        const press = tpl.content.getElementById('offline-sound-press');
        const hit = tpl.content.getElementById('offline-sound-hit');
        const reached = tpl.content.getElementById('offline-sound-reached');

        if (press && theme.sounds.press) press.src = theme.sounds.press;
        if (hit && theme.sounds.hit) hit.src = theme.sounds.hit;
        if (reached && theme.sounds.reached) reached.src = theme.sounds.reached;
      }
    }

    function openThemeModal() {
      const modal = document.getElementById('theme-modal');
      if (modal) modal.classList.remove('hidden');
    }

    function closeThemeModal() {
      const modal = document.getElementById('theme-modal');
      if (modal) modal.classList.add('hidden');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeThemeModal();
    });

    function renderFooter(activeKey) {
      const list = document.getElementById('theme-selector');
      const modalList = document.getElementById('modal-theme-selector');
      if (!list && !modalList) return;

      if (list) list.innerHTML = '';
      if (modalList) modalList.innerHTML = '';

      let keys = Object.keys(THEMES).filter(k => k !== activeKey);
      for (let i = keys.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [keys[i], keys[j]] = [keys[j], keys[i]];
      }
      keys.unshift(activeKey);

      keys.forEach(key => {
        const item = THEMES[key];
        if (!item) return;

        // Desktop dock
        if (list) {
          const li = document.createElement('li');
          if (key === activeKey) li.className = 'active-theme';
          li.innerHTML = `
            <a href="?theme=${key}" onclick="localStorage.setItem('dino_theme', '${key}')">
              <img src="${item.footerIcon}" alt="${item.footerTitle}" title="${item.footerTitle}">
            </a>`;
          list.appendChild(li);
        }

        // Mobile modal grid
        if (modalList) {
          const mLi = document.createElement('li');
          if (key === activeKey) mLi.className = 'active-theme';
          mLi.innerHTML = `
            <a href="?theme=${key}" onclick="localStorage.setItem('dino_theme', '${key}')">
              <img src="${item.footerIcon}" alt="${item.footerTitle}">
              <span class="modal-theme-label">${item.footerTitle}</span>
            </a>`;
          modalList.appendChild(mLi);
        }
      });
    }

    function dismissMessage() {
      const box = document.getElementById("messageBox");
      if (box) box.style.visibility = "hidden";
    }

    document.addEventListener("keydown", (e) => { if (e.keyCode === 32) dismissMessage(); });
    document.addEventListener("touchstart", dismissMessage, { once: true });

    // Apply theme immediately before game script initializes
    const activeTheme = getActiveThemeKey();
    applyTheme(activeTheme);
    document.addEventListener('DOMContentLoaded', () => {
      renderFooter(getActiveThemeKey());
    });
  </script>

  <!-- Core Runner Script -->
  <script src="./js/index.js"></script>
</body>
</html>
